      - name: "Weishaupt Laufzeit pro Start heute"
        unique_id: weishaupt_laufzeit_pro_start_heute
        unit_of_measurement: "h"
        availability: "{{ states('sensor.weishaupt_starts_tag') | float(0) > 0 }}"
        state: >-
          {{ (states('sensor.weishaupt_laufzeit_brenner_heute') | float(0)
              / states('sensor.weishaupt_starts_tag') | float(1)) | round(2) }}
      - name: "Weishaupt Laufzeit pro Start Monat"
        unique_id: weishaupt_laufzeit_pro_start_monat
        unit_of_measurement: "h"
        availability: "{{ states('sensor.weishaupt_starts_monat') | float(0) > 0 }}"
        state: >-
          {{ (states('sensor.weishaupt_laufzeit_brenner_monat') | float(0)
              / states('sensor.weishaupt_starts_monat') | float(1)) | round(2) }}
      - name: "Weishaupt Laufzeit pro Start Jahr"
