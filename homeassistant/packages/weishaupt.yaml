    - name: "Weishaupt Betriebsphase"
      unique_id: weishaupt_ebus_betriebsphase
      default_entity_id: sensor.weishaupt_betriebsphase
      state_topic: ebusd/wtc/Betriebsphase
      value_template: "{{ none if value_json['0'].value in [none, 32768] else value_json['0'].value }}"
      state_class: measurement
      icon: mdi:progress-clock
      expire_after: 600
    - name: "Weishaupt Laststellung"
      unique_id: weishaupt_ebus_laststellung
