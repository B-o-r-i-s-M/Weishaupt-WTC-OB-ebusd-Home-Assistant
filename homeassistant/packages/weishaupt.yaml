      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    - name: "Weishaupt Abgastemperatur"
      unique_id: weishaupt_ebus_abgastemperatur
      default_entity_id: sensor.weishaupt_abgastemperatur
      state_topic: ebusd/wtc/Abgastemp
      value_template: "{{ none if value_json['0'].value in [none, 32768] else value_json['0'].value }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    - name: "Weishaupt Wärmeanforderung"
      unique_id: weishaupt_ebus_warmeanforderung
      default_entity_id: sensor.weishaupt_warmeanforderung
      state_topic: ebusd/wtc/Waermeanforderung
      value_template: "{{ none if value_json['0'].value in [none, 32768] else value_json['0'].value }}"
      unit_of_measurement: "°C"
