        state: "{%- macro hm(e) -%}{%- if has_value(e) -%}{%- set m = ((states(e) | float(0)) * 60) | round(0) | int -%}{{ m // 60 }} h {{ '%02d' % (m % 60) }} min{%- else -%}–{%- endif -%}{%- endmacro -%}{{ hm('sensor.weishaupt_stufe_1_laufzeit_jahr') }}"
