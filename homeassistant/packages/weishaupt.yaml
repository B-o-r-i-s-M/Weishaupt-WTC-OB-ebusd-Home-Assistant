# Weishaupt WTC-OB über eBUS (ebusd) – Home-Assistant-Package
# Projekt: https://github.com/B-o-r-i-s-M/Weishaupt-WTC-OB-ebusd-Home-Assistant
#
# Ablage: <config>/packages/weishaupt.yaml
# Voraussetzung in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Benötigt Home Assistant 2025.10 oder neuer (default_entity_id, neue Trigger-Syntax)
# sowie die MQTT-Integration und die ebusd-App mit ebusd/weishaupt-wtc.csv.
#
# Datenquelle: ebusd veröffentlicht jeden Wert unter ebusd/<circuit>/<name>
#   als JSON {"0": {"name": "", "value": ...}}  (ebusd-Option --mqttjson)
#   wtc = Kessel (eBUS-Slave 08), hk1 = Heizkreis/WCM-FS (35), regler = Broadcast 05 07 des WCM-FS
# 32768 (0x8000) bedeutet beim Kessel "nicht verfügbar" und wird als unbekannt angezeigt.
#
# Tipp: Wer vorher eine REST-Abfrage des WCM-COM mit denselben Entitäts-IDs hatte, entfernt erst die
# alten REST-Entitäten aus der Registry; dann übernehmen diese Sensoren die IDs samt Verlauf/Statistik.

mqtt:
  sensor:
    - name: "Weishaupt Vorlauftemperatur"
      unique_id: weishaupt_ebus_vorlauftemperatur
      default_entity_id: sensor.weishaupt_vorlauftemperatur
      state_topic: ebusd/wtc/Vorlauftemp
      value_template: "{{ none if value_json['0'].value in [none, 32768] else value_json['0'].value }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    - name: "Weishaupt Warmwassertemperatur"
      unique_id: weishaupt_ebus_warmwassertemperatur
      default_entity_id: sensor.weishaupt_warmwassertemperatur
      state_topic: ebusd/wtc/Warmwassertemp
      value_template: "{{ none if value_json['0'].value in [none, 32768] else value_json['0'].value }}"
