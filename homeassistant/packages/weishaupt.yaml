      - name: "Weishaupt Anzeige Pro Start Jahr"
        unique_id: weishaupt_anzeige_pro_start_jahr
        icon: mdi:timer-sand
        state: "{%- macro hm(e) -%}{%- if has_value(e) -%}{%- set m = ((states(e) | float(0)) * 60) | round(0) | int -%}{{ m // 60 }} h {{ '%02d' % (m % 60) }} min{%- else -%}–{%- endif -%}{%- endmacro -%}{{ hm('sensor.weishaupt_laufzeit_pro_start_jahr') }}"
      - name: "Weishaupt Anzeige Letzter Lauf"
        unique_id: weishaupt_anzeige_letzter_lauf
        icon: mdi:history
        state: "{%- macro hm(e) -%}{%- if has_value(e) -%}{%- set m = ((states(e) | float(0)) * 60) | round(0) | int -%}{{ m // 60 }} h {{ '%02d' % (m % 60) }} min{%- else -%}–{%- endif -%}{%- endmacro -%}{{ hm('sensor.weishaupt_laufzeit_letzter_brennerlauf') }}"

  # Dauer jedes einzelnen Brennerlaufs (wird beim Ausgehen der Flamme gesetzt)
  - trigger:
      - trigger: state
        entity_id: binary_sensor.weishaupt_flamme
        from: "on"
        to: "off"
    sensor:
      - name: "Weishaupt Laufzeit letzter Brennerlauf"
        unique_id: weishaupt_laufzeit_letzter_brennerlauf
        unit_of_measurement: "h"
        state: "{{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() / 3600) | round(2) }}"
        attributes:
          aussentemperatur: "{{ states('sensor.weishaupt_aussentemperatur') }}"
          betriebsart: "{{ states('sensor.weishaupt_betriebsart') }}"

  # Laufzeit je Brennerlauf in Minuten, getrennt nach Heizung und Warmwasser (für das Schaubild "Takten").
  # Der Wert steht beim Ausgehen der Flamme (id: ende) und fällt 2 Minuten später (id: reset)
  # bzw. beim nächsten Start wieder auf 0. So entsteht im Schaubild je Lauf genau ein Balken.
  - trigger:
      - trigger: state
        entity_id: binary_sensor.weishaupt_flamme
        from: "on"
        to: "off"
        id: ende
      - trigger: state
        entity_id: binary_sensor.weishaupt_flamme
        to: "off"
        for: "00:02:00"
        id: reset
      - trigger: state
        entity_id: binary_sensor.weishaupt_flamme
        to: "on"
        id: start
    sensor:
      - name: "Weishaupt Lauf Heizung Minuten"
        unique_id: weishaupt_lauf_heizung_minuten
        unit_of_measurement: "min"
        state_class: measurement
        state: >-
          {% if trigger.id == 'ende' and is_state('binary_sensor.weishaupt_warmwasser', 'off') %}
            {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() / 60) | round(1) }}
          {% else %}0{% endif %}
      - name: "Weishaupt Lauf Warmwasser Minuten"
        unique_id: weishaupt_lauf_warmwasser_minuten
        unit_of_measurement: "min"
        state_class: measurement
        state: >-
          {% if trigger.id == 'ende' and is_state('binary_sensor.weishaupt_warmwasser', 'on') %}
            {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() / 60) | round(1) }}
          {% else %}0{% endif %}

# --- Zählerstände aus Tausender + Rest ---
# ebusd liest beide Teile nacheinander. Beim Übertrag (z. B. 19 999 -> 20 000) kann kurz ein Teil
# alt und einer neu sein; Sprünge über 500 werden deshalb um 1000 korrigiert. Die Zähler steigen
# real nur langsam (Öl < 3 L/h), echte Sprünge dieser Größe gibt es nicht.
  - trigger:
      - trigger: state
        entity_id: [sensor.weishaupt_oel_tausender, sensor.weishaupt_oel_rest]
    sensor:
      - name: "Weishaupt Ölzähler"
        unique_id: weishaupt_ebus_oelzaehler
        default_entity_id: sensor.weishaupt_olzahler
        unit_of_measurement: "L"
        device_class: volume
        state_class: total_increasing
        state: &zaehler >-
          {% set t = states(trigger.entity_id | replace('_rest', '_tausender')) %}
          {% set r = states(trigger.entity_id | replace('_tausender', '_rest')) %}
          {% if is_number(t) and is_number(r) %}
            {% set neu = (t | int) * 1000 + (r | int) %}
            {% set alt = this.state | int(neu) %}
            {% if neu < alt - 500 %}{{ neu + 1000 }}{% elif neu > alt + 500 and alt > 0 %}{{ neu - 1000 }}{% else %}{{ neu }}{% endif %}
          {% else %}{{ this.state }}{% endif %}
  - trigger:
      - trigger: state
        entity_id: [sensor.weishaupt_bstd_tausender, sensor.weishaupt_bstd_rest]
    sensor:
      - name: "Weishaupt Betriebsstunden Brenner"
        unique_id: weishaupt_ebus_betriebsstunden_brenner
        default_entity_id: sensor.weishaupt_betriebsstunden_brenner
        unit_of_measurement: "h"
        device_class: duration
        state_class: total_increasing
        state: *zaehler
  - trigger:
      - trigger: state
        entity_id: [sensor.weishaupt_starts_tausender, sensor.weishaupt_starts_rest]
    sensor:
      - name: "Weishaupt Brennerstarts"
        unique_id: weishaupt_ebus_brennerstarts
        default_entity_id: sensor.weishaupt_brennerstarts
        unit_of_measurement: "Starts"
        state_class: total_increasing
        state: *zaehler
