        state: "{%- macro hm(e) -%}{%- if has_value(e) -%}{%- set m = ((states(e) | float(0)) * 60) | round(0) | int -%}{{ m // 60 }} h {{ '%02d' % (m % 60) }} min{%- else -%}–{%- endif -%}{%- endmacro -%}{{ hm('sensor.weishaupt_laufzeit_warmwasser_heute') }}"
      - name: "Weishaupt Anzeige Warmwasser Monat"
        unique_id: weishaupt_anzeige_warmwasser_monat
        icon: mdi:water-boiler
        state: "{%- macro hm(e) -%}{%- if has_value(e) -%}{%- set m = ((states(e) | float(0)) * 60) | round(0) | int -%}{{ m // 60 }} h {{ '%02d' % (m % 60) }} min{%- else -%}–{%- endif -%}{%- endmacro -%}{{ hm('sensor.weishaupt_laufzeit_warmwasser_monat') }}"
      - name: "Weishaupt Anzeige Warmwasser Jahr"
        unique_id: weishaupt_anzeige_warmwasser_jahr
        icon: mdi:water-boiler
        state: "{%- macro hm(e) -%}{%- if has_value(e) -%}{%- set m = ((states(e) | float(0)) * 60) | round(0) | int -%}{{ m // 60 }} h {{ '%02d' % (m % 60) }} min{%- else -%}–{%- endif -%}{%- endmacro -%}{{ hm('sensor.weishaupt_laufzeit_warmwasser_jahr') }}"
      - name: "Weishaupt Anzeige Stufe 1 Heute"
