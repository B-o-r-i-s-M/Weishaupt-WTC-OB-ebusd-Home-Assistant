# --- Zähler pro Tag / Monat / Jahr (Öl und Starts aus Gerätezählern) ---
# Hinweis: Öl zählt das Gerät in ganzen Litern, Tageswerte springen daher.
# Jeder Zähler zeigt "Unbekannt", bis sich sein Quellwert das erste Mal ändert.
utility_meter:
  weishaupt_oel_tag:
    source: sensor.weishaupt_olzahler
    cycle: daily
    unique_id: weishaupt_oel_tag
  weishaupt_oel_monat:
    source: sensor.weishaupt_olzahler
    cycle: monthly
    unique_id: weishaupt_oel_monat
  weishaupt_oel_jahr:
    source: sensor.weishaupt_olzahler
    cycle: yearly
    unique_id: weishaupt_oel_jahr
  weishaupt_starts_tag:
    source: sensor.weishaupt_brennerstarts
    cycle: daily
    unique_id: weishaupt_starts_tag
  weishaupt_starts_monat:
    source: sensor.weishaupt_brennerstarts
    cycle: monthly
    unique_id: weishaupt_starts_monat
  weishaupt_starts_jahr:
    source: sensor.weishaupt_brennerstarts
    cycle: yearly
    unique_id: weishaupt_starts_jahr

# --- Laufzeiten aus dem Flammensignal (History-Statistik, Auflösung ca. 30 s) ---
# Gesamt = Flamme an; Heizung / Warmwasser = Flamme an UND jeweilige Betriebsart
sensor:
  - platform: history_stats
    name: "Weishaupt Laufzeit Brenner Heute"
    unique_id: weishaupt_laufzeit_brenner_heute
    entity_id: binary_sensor.weishaupt_flamme
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Laufzeit Brenner Monat"
    unique_id: weishaupt_laufzeit_brenner_monat
    entity_id: binary_sensor.weishaupt_flamme
    state: "on"
    type: time
    start: "{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Laufzeit Brenner Jahr"
    unique_id: weishaupt_laufzeit_brenner_jahr
    entity_id: binary_sensor.weishaupt_flamme
    state: "on"
    type: time
    start: "{{ now().replace(month=1, day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Weishaupt Laufzeit Heizung Heute"
    unique_id: weishaupt_laufzeit_heizung_heute
    entity_id: binary_sensor.weishaupt_brenner_heizung
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Laufzeit Heizung Monat"
    unique_id: weishaupt_laufzeit_heizung_monat
    entity_id: binary_sensor.weishaupt_brenner_heizung
    state: "on"
    type: time
    start: "{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Laufzeit Heizung Jahr"
    unique_id: weishaupt_laufzeit_heizung_jahr
    entity_id: binary_sensor.weishaupt_brenner_heizung
    state: "on"
    type: time
    start: "{{ now().replace(month=1, day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Weishaupt Laufzeit Warmwasser Heute"
    unique_id: weishaupt_laufzeit_warmwasser_heute
    entity_id: binary_sensor.weishaupt_brenner_warmwasser
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Laufzeit Warmwasser Monat"
    unique_id: weishaupt_laufzeit_warmwasser_monat
    entity_id: binary_sensor.weishaupt_brenner_warmwasser
    state: "on"
    type: time
    start: "{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Laufzeit Warmwasser Jahr"
    unique_id: weishaupt_laufzeit_warmwasser_jahr
    entity_id: binary_sensor.weishaupt_brenner_warmwasser
    state: "on"
    type: time
    start: "{{ now().replace(month=1, day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Weishaupt Stufe 2 Zeit Heute"
    unique_id: weishaupt_stufe_2_zeit_heute
    entity_id: binary_sensor.weishaupt_brenner_stufe_2
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Stufe 2 Zeit Monat"
    unique_id: weishaupt_stufe_2_zeit_monat
    entity_id: binary_sensor.weishaupt_brenner_stufe_2
    state: "on"
    type: time
    start: "{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Weishaupt Stufe 2 Zeit Jahr"
    unique_id: weishaupt_stufe_2_zeit_jahr
    entity_id: binary_sensor.weishaupt_brenner_stufe_2
    state: "on"
    type: time
    start: "{{ now().replace(month=1, day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

# --- Abgeleitete Werte ---
# Alle Laufzeiten in Stunden.
# Stufe 2 = gemessene Zeit, in der Flamme UND Magnetventil 2 aktiv sind (Auflösung = Abfrageintervall)
# Stufe 1 = Brennerlaufzeit - Stufe 2
# Ø Laufzeit pro Start = Brennerlaufzeit / Brennerstarts (Takt-Indikator)
template:
  - binary_sensor:
      - name: "Weishaupt Brenner Heizung"
        unique_id: weishaupt_brenner_heizung
        state: "{{ is_state('binary_sensor.weishaupt_flamme', 'on') and is_state('binary_sensor.weishaupt_heizung', 'on') }}"
      - name: "Weishaupt Brenner Stufe 2"
        unique_id: weishaupt_brenner_stufe_2
        state: "{{ is_state('binary_sensor.weishaupt_flamme', 'on') and is_state('binary_sensor.weishaupt_magnetventil_2', 'on') }}"
      - name: "Weishaupt Brenner Warmwasser"
        unique_id: weishaupt_brenner_warmwasser
        state: "{{ is_state('binary_sensor.weishaupt_flamme', 'on') and is_state('binary_sensor.weishaupt_warmwasser', 'on') }}"

  - sensor:
      # Klartext aus Flamme, Betriebsart (Dreiwegeventil) und Magnetventil 2
      - name: "Weishaupt Betriebsart"
        unique_id: weishaupt_betriebsart
        icon: mdi:fire-circle
        state: >-
          {%- if is_state('binary_sensor.weishaupt_flamme', 'on') -%}
            {%- if is_state('binary_sensor.weishaupt_warmwasser', 'on') -%}Warmwasser
            {%- elif is_state('binary_sensor.weishaupt_heizung', 'on') -%}Heizung
            {%- else -%}Brenner{%- endif -%}
            , Stufe {{ 2 if is_state('binary_sensor.weishaupt_magnetventil_2', 'on') else 1 }}
          {%- else -%}Brenner aus{%- endif -%}

      # Betriebsphase (i10) laut Anleitung im Klartext
      - name: "Weishaupt Betriebsphase Text"
        unique_id: weishaupt_betriebsphase_text
        icon: mdi:progress-clock
        availability: "{{ has_value('sensor.weishaupt_betriebsphase') }}"
        state: >-
          {{ {0: 'Bereitschaft', 1: 'Ruhestandskontrolle', 2: 'Ölvorwärmung', 3: 'Vorbelüftung',
              4: 'Sicherheitszeit', 5: 'Nachzündung', 6: 'Flammenstabilisierung',
              7: 'Reglerfreigabe', 8: 'Nachbelüftung', 9: 'Zwangsbelüftung'}
              .get(states('sensor.weishaupt_betriebsphase') | int(0), 'unbekannt') }}

      # Wärmeanforderung je nach aktiver Betriebsart (Dreiwegeventil):
      # Warmwasser aktiv -> Sollwert Warmwasser, Heizung aktiv -> Sollwert Heizen
      - name: "Weishaupt Sollwert Heizen"
        unique_id: weishaupt_sollwert_heizen
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ has_value('sensor.weishaupt_warmeanforderung')
             and is_state('binary_sensor.weishaupt_heizung', 'on')
             and is_state('binary_sensor.weishaupt_warmwasser', 'off') }}
        state: "{{ states('sensor.weishaupt_warmeanforderung') }}"
      - name: "Weishaupt Sollwert Warmwasser"
        unique_id: weishaupt_sollwert_warmwasser
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ has_value('sensor.weishaupt_warmeanforderung')
             and is_state('binary_sensor.weishaupt_warmwasser', 'on') }}
        state: "{{ states('sensor.weishaupt_warmeanforderung') }}"

      # Vorlauf mit Sollwert der gerade aktiven Betriebsart (Dashboard-Kachel "Vorlauf")
      - name: "Weishaupt Anzeige Vorlauf"
        unique_id: weishaupt_anzeige_vorlauf
        icon: mdi:radiator
        availability: "{{ has_value('sensor.weishaupt_vorlauftemperatur') }}"
        state: >-
          {% set ist = states('sensor.weishaupt_vorlauftemperatur') | float(0) | round(1) | string | replace('.', ',') %}
          {% set soll = states('sensor.weishaupt_warmeanforderung') %}
          {% if is_number(soll) and (is_state('binary_sensor.weishaupt_warmwasser', 'on') or is_state('binary_sensor.weishaupt_heizung', 'on')) %}
          {{ ist }} → {{ soll | float | round(1) | string | replace('.', ',') }} °C
          {%- else -%}{{ ist }} °C{%- endif %}
        attributes:
          modus: >-
            {{ 'Warmwasser' if is_state('binary_sensor.weishaupt_warmwasser', 'on')
               else ('Heizen' if is_state('binary_sensor.weishaupt_heizung', 'on') else '') }}

      - name: "Weishaupt Stufe 1 Laufzeit heute"
        unique_id: weishaupt_stufe_1_laufzeit_heute
        unit_of_measurement: "h"
        state: >-
          {% set gesamt = states('sensor.weishaupt_laufzeit_brenner_heute') | float(0) %}
          {% set s2 = states('sensor.weishaupt_stufe_2_zeit_heute') | float(0) %}
          {{ [gesamt - s2, 0] | max | round(2) }}
      - name: "Weishaupt Stufe 1 Laufzeit Monat"
        unique_id: weishaupt_stufe_1_laufzeit_monat
        unit_of_measurement: "h"
